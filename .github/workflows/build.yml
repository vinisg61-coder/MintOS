name: Build ProjectNERV

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Select normal fail-fast mode or debug mode that collects build errors
        type: choice
        options:
          - normal
          - debug
        default: normal
        required: true
      publish_release:
        description: Publish the installable ZIP as a regular GitHub Release
        type: boolean
        default: false
        required: true
      publish_ota:
        description: Publish OTA for A52s devices (also creates a GitHub Release for the updater)
        type: boolean
        default: false
        required: true
      upload_gofile:
        description: Upload the installable ZIP to GoFile (no API key required)
        type: boolean
        default: false
        required: true
      upload_pixeldrain:
        description: Upload the installable ZIP to Pixeldrain (requires PIXELDRAIN_API_KEY secret)
        type: boolean
        default: false
        required: true
  pull_request:
  push:
    branches:
      - 'paradigm'
      - 'a52sxq-mintos-adapted'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ROM_BUILD_MODE: ${{ github.event.inputs.build_mode || 'normal' }}

    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Calculate submodule cache key
        id: submodule-refs
        run: |
          key="$(git ls-tree HEAD -- \
            external/android-tools \
            external/apktool \
            external/erofs-utils \
            external/img2sdat \
            external/signapk \
            external/smali | sha256sum | cut -d' ' -f1)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore build-tool submodule cache
        id: submodule-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ steps.submodule-refs.outputs.key }}

      - name: Checkout required build-tool submodules
        run: |
          git submodule update --init --depth=1 --recursive \
            external/android-tools \
            external/apktool \
            external/erofs-utils \
            external/img2sdat \
            external/signapk \
            external/smali

      - name: Save build-tool submodule cache
        if: success() && steps.submodule-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ steps.submodule-refs.outputs.key }}

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Calculate apt cache key
        id: apt-cache-key
        run: |
          packages_hash="$(sha256sum scripts/apt-build-packages.txt | cut -d' ' -f1)"
          echo "key=apt-${RUNNER_OS}-${ImageOS}-${ImageVersion}-${packages_hash}" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-${RUNNER_OS}-${ImageOS}-" >> "$GITHUB_OUTPUT"

      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache/apt/archives
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: ${{ steps.apt-cache-key.outputs.prefix }}

      - name: Set up build environment
        run: |
          apt_archives="$GITHUB_WORKSPACE/.cache/apt/archives"
          mkdir -p "$apt_archives/partial"
          sudo chown _apt "$apt_archives/partial"
          sudo chmod 700 "$apt_archives/partial"
          sudo apt update
          mapfile -t apt_packages < scripts/apt-build-packages.txt
          sudo env DEBIAN_FRONTEND=noninteractive apt install -yq \
            -o "Dir::Cache::archives=$apt_archives" \
            -o APT::Keep-Downloaded-Packages=true \
            "${apt_packages[@]}"
          sudo chmod 755 "$apt_archives/partial"
          sudo rm -f "$apt_archives/lock"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/platform.x509.pem

      - name: Save apt package cache
        if: success() && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/apt/archives
          key: ${{ steps.apt-cache-key.outputs.key }}

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Calculate dependency cache key
        id: dependency-refs
        run: |
          submodules="$(git submodule status --recursive | sha256sum | cut -d' ' -f1)"
          packages="$(dpkg-query -W -f='${binary:Package}=${Version}\n' | sort | sha256sum | cut -d' ' -f1)"
          echo "submodules=$submodules" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Restore compiled build tools
        id: tools-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: out/tools
          key: tools-${{ runner.os }}-ubuntu24-${{ hashFiles('external/make.sh', 'scripts/build_dependencies.sh', 'scripts/download_magiskboot.sh', 'scripts/download_samloader.sh', 'scripts/gradle-mirror.init.gradle', 'buildenv.sh', 'target/a52sxq/config.sh', 'unica/configs/qssi.sh', 'unica/configs/essi.sh') }}-${{ steps.dependency-refs.outputs.submodules }}-${{ steps.dependency-refs.outputs.packages }}

      - name: Build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Save compiled build tools
        if: success() && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: out/tools
          key: tools-${{ runner.os }}-ubuntu24-${{ hashFiles('external/make.sh', 'scripts/build_dependencies.sh', 'scripts/download_magiskboot.sh', 'scripts/download_samloader.sh', 'scripts/gradle-mirror.init.gradle', 'buildenv.sh', 'target/a52sxq/config.sh', 'unica/configs/qssi.sh', 'unica/configs/essi.sh') }}-${{ steps.dependency-refs.outputs.submodules }}-${{ steps.dependency-refs.outputs.packages }}

      - name: Calculate firmware cache paths
        id: firmware-paths
        run: |
          source ./buildenv.sh ${{ matrix.target }}

          write_firmware_path() {
            local kind="$1"
            local firmware="$2"
            local model csc dir cache_prefix

            model="$(cut -d '/' -f 1 <<< "$firmware")"
            csc="$(cut -d '/' -f 2 <<< "$firmware")"
            dir="${model}_${csc}"
            cache_prefix="firmware-${RUNNER_OS}-${kind}-${dir}-"
            echo "${kind}_dir=${dir}" >> "$GITHUB_OUTPUT"
            echo "${kind}_lookup_key=${cache_prefix}lookup" >> "$GITHUB_OUTPUT"
            echo "${kind}_cache_prefix=${cache_prefix}" >> "$GITHUB_OUTPUT"
          }

          write_firmware_path source "$SOURCE_FIRMWARE"
          write_firmware_path target "$TARGET_FIRMWARE"

      - name: Restore source firmware cache
        id: source-firmware-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: out/odin/${{ steps.firmware-paths.outputs.source_dir }}
          key: ${{ steps.firmware-paths.outputs.source_lookup_key }}
          restore-keys: ${{ steps.firmware-paths.outputs.source_cache_prefix }}

      - name: Restore target firmware cache
        id: target-firmware-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: out/odin/${{ steps.firmware-paths.outputs.target_dir }}
          key: ${{ steps.firmware-paths.outputs.target_lookup_key }}
          restore-keys: ${{ steps.firmware-paths.outputs.target_cache_prefix }}

      - name: Resolve latest firmware versions
        id: firmware-refs
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          source ./scripts/utils/firmware_utils.sh

          write_firmware_version() {
            local kind="$1"
            local firmware="$2"
            local model csc latest version_hash

            model="$(cut -d '/' -f 1 <<< "$firmware")"
            csc="$(cut -d '/' -f 2 <<< "$firmware")"
            latest="$(GET_LATEST_FIRMWARE "$model" "$csc" || true)"
            echo "${kind}_latest=${latest}" >> "$GITHUB_OUTPUT"
            version_hash="$(printf '%s' "$latest" | sha256sum | cut -c1-16)"
            echo "${kind}_hash=${version_hash}" >> "$GITHUB_OUTPUT"
            if [ -z "$latest" ]; then
              echo "::warning::Latest firmware lookup failed for $model/$csc; a restored cache will be used if available."
            fi
          }

          write_firmware_version source "$SOURCE_FIRMWARE"
          write_firmware_version target "$TARGET_FIRMWARE"
          write_firmware_version donor "SM-G990B/EUX/353718681234563"

      - name: Restore optical fingerprint donor cache
        id: optical-donor-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            prebuilts/samsung/r9qxxx/system/bin/surfaceflinger
            prebuilts/samsung/r9qxxx/system/lib/libgui.so
            prebuilts/samsung/r9qxxx/system/lib/libui.so
            prebuilts/samsung/r9qxxx/system/lib64/libgui.so
            prebuilts/samsung/r9qxxx/system/lib64/libui.so
            prebuilts/samsung/r9qxxx/system/priv-app/BiometricSetting/BiometricSetting.apk
            prebuilts/samsung/r9qxxx/.optical-fod-version
          key: fp-donor-${{ runner.os }}-G990B_EUX-${{ steps.firmware-refs.outputs.donor_hash }}
          restore-keys: fp-donor-${{ runner.os }}-G990B_EUX-

      - name: Check restored optical fingerprint donor cache
        id: optical-donor-cache-check
        env:
          EXPECTED_DONOR_FIRMWARE: ${{ steps.firmware-refs.outputs.donor_latest }}
        run: |
          files=(
            "prebuilts/samsung/r9qxxx/system/bin/surfaceflinger"
            "prebuilts/samsung/r9qxxx/system/lib/libgui.so"
            "prebuilts/samsung/r9qxxx/system/lib/libui.so"
            "prebuilts/samsung/r9qxxx/system/lib64/libgui.so"
            "prebuilts/samsung/r9qxxx/system/lib64/libui.so"
            "prebuilts/samsung/r9qxxx/system/priv-app/BiometricSetting/BiometricSetting.apk"
            "prebuilts/samsung/r9qxxx/.optical-fod-version"
          )
          usable=true
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              usable=false
              break
            fi
          done

          if [[ "$usable" == "true" && -n "$EXPECTED_DONOR_FIRMWARE" ]]; then
            cached_donor_firmware="$(cat prebuilts/samsung/r9qxxx/.optical-fod-version)"
            [[ "$cached_donor_firmware" == "$EXPECTED_DONOR_FIRMWARE" ]] || usable=false
          fi
          echo "usable=$usable" >> "$GITHUB_OUTPUT"

      - name: Check restored source firmware cache
        id: source-firmware-cache-check
        env:
          FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.source_dir }}
          EXPECTED_FIRMWARE: ${{ steps.firmware-refs.outputs.source_latest }}
        run: |
          marker="out/odin/$FIRMWARE_DIR/.downloaded"
          if [[ -s "$marker" ]]; then
            cached_firmware="$(cat "$marker")"
            if [[ -z "$EXPECTED_FIRMWARE" || "$cached_firmware" == "$EXPECTED_FIRMWARE" ]]; then
              echo "usable=true" >> "$GITHUB_OUTPUT"
              echo "Using cached source firmware $cached_firmware"
              exit 0
            fi
            echo "Cached source firmware $cached_firmware is stale; expected $EXPECTED_FIRMWARE"
          fi
          echo "usable=false" >> "$GITHUB_OUTPUT"

      - name: Check restored target firmware cache
        id: target-firmware-cache-check
        env:
          FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.target_dir }}
          EXPECTED_FIRMWARE: ${{ steps.firmware-refs.outputs.target_latest }}
        run: |
          marker="out/odin/$FIRMWARE_DIR/.downloaded"
          if [[ -s "$marker" ]]; then
            cached_firmware="$(cat "$marker")"
            if [[ -z "$EXPECTED_FIRMWARE" || "$cached_firmware" == "$EXPECTED_FIRMWARE" ]]; then
              echo "usable=true" >> "$GITHUB_OUTPUT"
              echo "Using cached target firmware $cached_firmware"
              exit 0
            fi
            echo "Cached target firmware $cached_firmware is stale; expected $EXPECTED_FIRMWARE"
          fi
          echo "usable=false" >> "$GITHUB_OUTPUT"

      - name: Discard stale firmware caches
        if: steps.source-firmware-cache-check.outputs.usable != 'true' || steps.target-firmware-cache-check.outputs.usable != 'true'
        env:
          SOURCE_FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.source_dir }}
          SOURCE_CACHE_USABLE: ${{ steps.source-firmware-cache-check.outputs.usable }}
          TARGET_FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.target_dir }}
          TARGET_CACHE_USABLE: ${{ steps.target-firmware-cache-check.outputs.usable }}
        run: |
          if [[ "$SOURCE_CACHE_USABLE" != "true" ]]; then
            rm -rf "out/odin/$SOURCE_FIRMWARE_DIR"
          fi
          if [[ "$TARGET_CACHE_USABLE" != "true" ]]; then
            rm -rf "out/odin/$TARGET_FIRMWARE_DIR"
          fi

      - name: Download source firmware
        if: steps.source-firmware-cache-check.outputs.usable != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-target

      - name: Calculate source firmware cache key
        id: source-firmware-key
        if: steps.source-firmware-cache-check.outputs.usable != 'true'
        env:
          FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.source_dir }}
        run: |
          marker="out/odin/$FIRMWARE_DIR/.downloaded"
          if [[ ! -s "$marker" ]]; then
            echo "Downloaded source firmware marker is missing: $marker" >&2
            exit 1
          fi
          firmware="$(cat "$marker")"
          version_hash="$(printf '%s' "$firmware" | sha256sum | cut -c1-16)"
          echo "key=firmware-${RUNNER_OS}-source-${FIRMWARE_DIR}-${version_hash}" >> "$GITHUB_OUTPUT"

      - name: Save source firmware cache
        if: success() && steps.source-firmware-cache-check.outputs.usable != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: out/odin/${{ steps.firmware-paths.outputs.source_dir }}
          key: ${{ steps.source-firmware-key.outputs.key }}

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-target

      - name: Download target firmware
        if: steps.target-firmware-cache-check.outputs.usable != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-source

      - name: Calculate target firmware cache key
        id: target-firmware-key
        if: steps.target-firmware-cache-check.outputs.usable != 'true'
        env:
          FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.target_dir }}
        run: |
          marker="out/odin/$FIRMWARE_DIR/.downloaded"
          if [[ ! -s "$marker" ]]; then
            echo "Downloaded target firmware marker is missing: $marker" >&2
            exit 1
          fi
          firmware="$(cat "$marker")"
          version_hash="$(printf '%s' "$firmware" | sha256sum | cut -c1-16)"
          echo "key=firmware-${RUNNER_OS}-target-${FIRMWARE_DIR}-${version_hash}" >> "$GITHUB_OUTPUT"

      - name: Save target firmware cache
        if: success() && steps.target-firmware-cache-check.outputs.usable != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: out/odin/${{ steps.firmware-paths.outputs.target_dir }}
          key: ${{ steps.target-firmware-key.outputs.key }}

      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-source

      - name: Prepare optical fingerprint donor blobs
        if: steps.optical-donor-cache-check.outputs.usable != 'true'
        env:
          DONOR_FIRMWARE: SM-G990B/EUX/353718681234563
          DONOR_DIR: G990B_EUX
          SOURCE_FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.source_dir }}
          TARGET_FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.target_dir }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}

          # The firmware ZIP caches have already been saved, and both OS images extracted.
          # Drop the ZIPs to make room for the one-time optical donor extraction.
          rm -rf "$ODIN_DIR/$SOURCE_FIRMWARE_DIR" "$ODIN_DIR/$TARGET_FIRMWARE_DIR"

          ./scripts/download_fw.sh --ignore-target --ignore-source "$DONOR_FIRMWARE"
          ./scripts/extract_fw.sh --ignore-target --ignore-source "$DONOR_FIRMWARE"

          donor_partition="$FW_DIR/$DONOR_DIR/system"
          donor_system="$donor_partition/system"
          [[ -d "$donor_system/bin" ]] || donor_system="$donor_partition"
          donor_root="prebuilts/samsung/r9qxxx/system"
          required_files=(
            "bin/surfaceflinger"
            "lib/libgui.so"
            "lib/libui.so"
            "lib64/libgui.so"
            "lib64/libui.so"
            "priv-app/BiometricSetting/BiometricSetting.apk"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$donor_system/$file" ]]; then
              echo "Missing optical fingerprint donor file: $donor_system/$file" >&2
              exit 1
            fi
            mkdir -p "$donor_root/$(dirname "$file")"
            cp -f "$donor_system/$file" "$donor_root/$file"
          done

          cp -f "$FW_DIR/$DONOR_DIR/.extracted" "prebuilts/samsung/r9qxxx/.optical-fod-version"

          rm -rf "$ODIN_DIR/$DONOR_DIR" "$FW_DIR/$DONOR_DIR"

      - name: Save optical fingerprint donor cache
        if: success() && steps.optical-donor-cache-check.outputs.usable != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            prebuilts/samsung/r9qxxx/system/bin/surfaceflinger
            prebuilts/samsung/r9qxxx/system/lib/libgui.so
            prebuilts/samsung/r9qxxx/system/lib/libui.so
            prebuilts/samsung/r9qxxx/system/lib64/libgui.so
            prebuilts/samsung/r9qxxx/system/lib64/libui.so
            prebuilts/samsung/r9qxxx/system/priv-app/BiometricSetting/BiometricSetting.apk
            prebuilts/samsung/r9qxxx/.optical-fod-version
          key: fp-donor-${{ runner.os }}-G990B_EUX-${{ steps.firmware-refs.outputs.donor_hash }}

      - name: Build ROM
        id: build-rom
        continue-on-error: ${{ env.ROM_BUILD_MODE == 'debug' }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              ./scripts/make_rom.sh --no-rom-zip
          else
              ./scripts/make_rom.sh
          fi

      - name: Upload installable ROM ZIP
        if: steps.build-rom.outcome == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/a52sxq-mintos-adapted'))
        uses: actions/upload-artifact@v6
        with:
          name: MintOS-a52sxq-${{ github.run_number }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload ROM debug diagnostics
        if: always() && env.ROM_BUILD_MODE == 'debug'
        uses: actions/upload-artifact@v6
        with:
          name: MintOS-a52sxq-debug-${{ github.run_number }}
          path: out/target/a52sxq/rom-build-errors.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: build
    if: >-
      needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.build_mode == 'normal' &&
      (inputs.publish_release == true || inputs.publish_ota == true ||
      inputs.upload_gofile == true || inputs.upload_pixeldrain == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Download installable A52s ROM ZIP
        uses: actions/download-artifact@v6
        with:
          name: MintOS-a52sxq-${{ github.run_number }}
          path: out

      - name: Locate installable ZIP
        id: package
        run: |
          shopt -s nullglob
          zips=(out/*.zip)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "Expected one installable ZIP in out/, found ${#zips[@]}" >&2
            printf ' - %s\n' "${zips[@]}" >&2
            exit 1
          fi
          echo "path=${zips[0]}" >> "$GITHUB_OUTPUT"
          zip_size="$(stat -c '%s' "${zips[0]}")"
          echo "size=$zip_size" >> "$GITHUB_OUTPUT"
          echo "ROM ZIP: ${zips[0]}"

      - name: Calculate release tag
        id: release-tag
        env:
          ROM_ZIP: ${{ steps.package.outputs.path }}
        run: |
          python3 - "$ROM_ZIP" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT" <<'PY'
          import datetime
          import sys
          import zipfile

          path, run_number, run_attempt = sys.argv[1:]
          with zipfile.ZipFile(path) as package:
              info = dict(line.split("=", 1) for line in package.read("build_info.txt").decode().splitlines() if "=" in line)
          if not all(info.get(key) for key in ("version", "timestamp", "device")):
              raise SystemExit("build_info.txt is missing version, timestamp, or device")
          if info["device"] != "a52sxq":
              raise SystemExit(f"Refusing to publish unexpected device: {info['device']}")
          date = datetime.datetime.fromtimestamp(int(info["timestamp"]), datetime.timezone.utc)
          print(f"tag=MintOS-{info['version']}-{date:%Y%m%d-%H%M}-run{run_number}-attempt{run_attempt}")
          print(f"version={info['version']}")
          PY

      - name: Upload ROM to GoFile
        if: inputs.upload_gofile == true
        id: gofile-upload
        continue-on-error: true
        run: ./scripts/upload_gofile.sh "${{ steps.package.outputs.path }}"

      - name: Upload ROM to Pixeldrain
        if: inputs.upload_pixeldrain == true
        id: pixeldrain-upload
        continue-on-error: true
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: ./scripts/upload_pixeldrain.sh "${{ steps.package.outputs.path }}"

      - name: Publish regular GitHub Release
        if: inputs.publish_release == true && inputs.publish_ota != true
        id: release-publish
        env:
          GH_TOKEN: ${{ github.token }}
          ROM_ZIP: ${{ steps.package.outputs.path }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          ROM_VERSION: ${{ steps.release-tag.outputs.version }}
        run: |
          max_asset_size=$((2000 * 1024 * 1024))
          zip_size="$(stat -c '%s' "$ROM_ZIP")"
          release_assets=("$ROM_ZIP")

          if (( zip_size > max_asset_size )); then
            mkdir -p out/release-assets
            prefix="out/release-assets/$(basename "$ROM_ZIP").part."
            split --bytes=1900M --numeric-suffixes=1 --suffix-length=3 \
              "$ROM_ZIP" "$prefix"
            release_assets=("${prefix}"*)
            instructions="out/release-assets/INSTALL.txt"
            cat > "$instructions" <<EOF
          MintOS installable ZIP: $(basename "$ROM_ZIP")

          GitHub limits each release asset to 2 GiB, so the ZIP is split across the .part.001, .part.002, ... files.
          Download every part into the same folder, then join them in filename order.

          Linux/macOS:
            cat "$(basename "$ROM_ZIP")".part.* > "$(basename "$ROM_ZIP")"

          Windows PowerShell:
            \$parts = Get-ChildItem "$(basename "$ROM_ZIP").part.*" | Sort-Object Name
            \$dest = [IO.File]::Create("$(basename "$ROM_ZIP")")
            foreach (\$part in \$parts) {
              \$source = [IO.File]::OpenRead(\$part.FullName)
              \$source.CopyTo(\$dest)
              \$source.Dispose()
            }
            \$dest.Dispose()
          EOF
            release_assets+=("$instructions")
          fi

          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MintOS $ROM_VERSION for Galaxy A52s" \
            --notes "Installable MintOS build for the Galaxy A52s (a52sxq)." \
            --latest=false
          echo "### GitHub Release" >> "$GITHUB_STEP_SUMMARY"
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish A52s OTA update
        if: inputs.publish_ota == true
        id: ota-publish
        env:
          GH_TOKEN: ${{ github.token }}
          ROM_ZIP: ${{ steps.package.outputs.path }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          python3 scripts/fota_release.py prepare \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --target-commitish "$GITHUB_SHA" \
            --publish \
            "$ROM_ZIP"
          echo "### A52s OTA" >> "$GITHUB_STEP_SUMMARY"
          echo "Published for device updates: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Add regular release details to OTA release
        if: inputs.publish_ota == true && inputs.publish_release == true
        id: ota-release-details
        env:
          GH_TOKEN: ${{ github.token }}
          ROM_ZIP: ${{ steps.package.outputs.path }}
          ROM_ZIP_SIZE: ${{ steps.package.outputs.size }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          ROM_VERSION: ${{ steps.release-tag.outputs.version }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "MintOS $ROM_VERSION for Galaxy A52s" \
            --notes "Installable MintOS build and A52s OTA update."

          if (( ROM_ZIP_SIZE > 2000 * 1024 * 1024 )); then
            instructions="out/INSTALL.txt"
            cat > "$instructions" <<EOF
          MintOS installable ZIP: $(basename "$ROM_ZIP")

          GitHub limits each release asset to 2 GiB, so the ZIP is split across the .001, .002, ... files.
          Download every package part into the same folder, then join them in filename order.

          Linux/macOS:
            cat "$(basename "$ROM_ZIP")".0* > "$(basename "$ROM_ZIP")"

          Windows PowerShell:
            \$parts = Get-ChildItem "$(basename "$ROM_ZIP").0*" | Sort-Object Name
            \$dest = [IO.File]::Create("$(basename "$ROM_ZIP")")
            foreach (\$part in \$parts) {
              \$source = [IO.File]::OpenRead(\$part.FullName)
              \$source.CopyTo(\$dest)
              \$source.Dispose()
            }
            \$dest.Dispose()
          EOF
            gh release upload "$RELEASE_TAG" "$instructions" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Add GoFile upload to summary
        if: always() && inputs.upload_gofile == true
        env:
          DOWNLOAD_URL: ${{ steps.gofile-upload.outputs.url }}
        run: |
          echo "### GoFile" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$DOWNLOAD_URL" ]]; then
            echo "Download: $DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Upload failed; see the GoFile step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add Pixeldrain upload to summary
        if: always() && inputs.upload_pixeldrain == true
        env:
          DOWNLOAD_URL: ${{ steps.pixeldrain-upload.outputs.url }}
        run: |
          echo "### Pixeldrain" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$DOWNLOAD_URL" ]]; then
            echo "Download: $DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Upload failed; see the Pixeldrain step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if a requested destination failed
        if: always()
        env:
          WANT_RELEASE: ${{ inputs.publish_release }}
          WANT_OTA: ${{ inputs.publish_ota }}
          WANT_GOFILE: ${{ inputs.upload_gofile }}
          WANT_PIXELDRAIN: ${{ inputs.upload_pixeldrain }}
          RELEASE_RESULT: ${{ steps.release-publish.outcome }}
          OTA_RESULT: ${{ steps.ota-publish.outcome }}
          OTA_DETAILS_RESULT: ${{ steps.ota-release-details.outcome }}
          GOFILE_RESULT: ${{ steps.gofile-upload.outcome }}
          PIXELDRAIN_RESULT: ${{ steps.pixeldrain-upload.outcome }}
        run: |
          failed=()
          if [[ "$WANT_RELEASE" == "true" && "$WANT_OTA" != "true" && "$RELEASE_RESULT" != "success" ]]; then
            failed+=("GitHub Release")
          fi
          if [[ "$WANT_OTA" == "true" && "$OTA_RESULT" != "success" ]]; then
            failed+=("A52s OTA")
          fi
          if [[ "$WANT_RELEASE" == "true" && "$WANT_OTA" == "true" && "$OTA_DETAILS_RESULT" != "success" ]]; then
            failed+=("GitHub Release details")
          fi
          if [[ "$WANT_GOFILE" == "true" && "$GOFILE_RESULT" != "success" ]]; then
            failed+=("GoFile")
          fi
          if [[ "$WANT_PIXELDRAIN" == "true" && "$PIXELDRAIN_RESULT" != "success" ]]; then
            failed+=("Pixeldrain")
          fi
          if (( ${#failed[@]} > 0 )); then
            printf 'Requested destination(s) failed: %s\n' "${failed[*]}" >&2
            exit 1
          fi
