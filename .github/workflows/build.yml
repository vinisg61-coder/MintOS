name: Build ProjectNERV

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'paradigm'
      - 'a52sxq-mintos-adapted'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Calculate submodule cache key
        id: submodule-refs
        run: |
          key="$(git ls-tree HEAD -- \
            external/android-tools \
            external/apktool \
            external/erofs-utils \
            external/img2sdat \
            external/signapk \
            external/smali | sha256sum | cut -d' ' -f1)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore build-tool submodule cache
        id: submodule-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ steps.submodule-refs.outputs.key }}

      - name: Checkout required build-tool submodules
        run: |
          git submodule update --init --depth=1 --recursive \
            external/android-tools \
            external/apktool \
            external/erofs-utils \
            external/img2sdat \
            external/signapk \
            external/smali

      - name: Save build-tool submodule cache
        if: success() && steps.submodule-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ steps.submodule-refs.outputs.key }}

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Calculate apt cache key
        id: apt-cache-key
        run: |
          packages_hash="$(sha256sum scripts/apt-build-packages.txt | cut -d' ' -f1)"
          echo "key=apt-${RUNNER_OS}-${ImageOS}-${ImageVersion}-${packages_hash}" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-${RUNNER_OS}-${ImageOS}-" >> "$GITHUB_OUTPUT"

      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/apt/archives
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: ${{ steps.apt-cache-key.outputs.prefix }}

      - name: Set up build environment
        run: |
          apt_archives="$GITHUB_WORKSPACE/.cache/apt/archives"
          mkdir -p "$apt_archives/partial"
          sudo chown _apt "$apt_archives/partial"
          sudo chmod 700 "$apt_archives/partial"
          sudo apt update
          mapfile -t apt_packages < scripts/apt-build-packages.txt
          sudo env DEBIAN_FRONTEND=noninteractive apt install -yq \
            -o "Dir::Cache::archives=$apt_archives" \
            -o APT::Keep-Downloaded-Packages=true \
            "${apt_packages[@]}"
          sudo chmod 755 "$apt_archives/partial"
          sudo rm -f "$apt_archives/lock"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/platform.x509.pem

      - name: Save apt package cache
        if: success() && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache/apt/archives
          key: ${{ steps.apt-cache-key.outputs.key }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Calculate dependency cache key
        id: dependency-refs
        run: |
          submodules="$(git submodule status --recursive | sha256sum | cut -d' ' -f1)"
          packages="$(dpkg-query -W -f='${binary:Package}=${Version}\n' | sort | sha256sum | cut -d' ' -f1)"
          echo "submodules=$submodules" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Restore compiled build tools
        id: tools-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: out/tools
          key: tools-${{ runner.os }}-ubuntu24-${{ hashFiles('external/make.sh', 'scripts/build_dependencies.sh', 'scripts/download_magiskboot.sh', 'scripts/download_samloader.sh', 'scripts/gradle-mirror.init.gradle', 'buildenv.sh', 'target/a52sxq/config.sh', 'unica/configs/qssi.sh', 'unica/configs/essi.sh') }}-${{ steps.dependency-refs.outputs.submodules }}-${{ steps.dependency-refs.outputs.packages }}

      - name: Build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Save compiled build tools
        if: success() && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: out/tools
          key: tools-${{ runner.os }}-ubuntu24-${{ hashFiles('external/make.sh', 'scripts/build_dependencies.sh', 'scripts/download_magiskboot.sh', 'scripts/download_samloader.sh', 'scripts/gradle-mirror.init.gradle', 'buildenv.sh', 'target/a52sxq/config.sh', 'unica/configs/qssi.sh', 'unica/configs/essi.sh') }}-${{ steps.dependency-refs.outputs.submodules }}-${{ steps.dependency-refs.outputs.packages }}

      - name: Calculate firmware cache paths
        id: firmware-paths
        run: |
          source ./buildenv.sh ${{ matrix.target }}

          write_firmware_path() {
            local kind="$1"
            local firmware="$2"
            local model csc dir cache_prefix

            model="$(cut -d '/' -f 1 <<< "$firmware")"
            csc="$(cut -d '/' -f 2 <<< "$firmware")"
            dir="${model}_${csc}"
            cache_prefix="firmware-${RUNNER_OS}-${kind}-${dir}-"
            echo "${kind}_dir=${dir}" >> "$GITHUB_OUTPUT"
            echo "${kind}_lookup_key=${cache_prefix}lookup" >> "$GITHUB_OUTPUT"
            echo "${kind}_cache_prefix=${cache_prefix}" >> "$GITHUB_OUTPUT"
          }

          write_firmware_path source "$SOURCE_FIRMWARE"
          write_firmware_path target "$TARGET_FIRMWARE"

      - name: Restore source firmware cache
        id: source-firmware-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: out/odin/${{ steps.firmware-paths.outputs.source_dir }}
          key: ${{ steps.firmware-paths.outputs.source_lookup_key }}
          restore-keys: ${{ steps.firmware-paths.outputs.source_cache_prefix }}

      - name: Restore target firmware cache
        id: target-firmware-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: out/odin/${{ steps.firmware-paths.outputs.target_dir }}
          key: ${{ steps.firmware-paths.outputs.target_lookup_key }}
          restore-keys: ${{ steps.firmware-paths.outputs.target_cache_prefix }}

      - name: Resolve latest firmware versions
        id: firmware-refs
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          source ./scripts/utils/firmware_utils.sh

          write_firmware_version() {
            local kind="$1"
            local firmware="$2"
            local model csc latest

            model="$(cut -d '/' -f 1 <<< "$firmware")"
            csc="$(cut -d '/' -f 2 <<< "$firmware")"
            latest="$(GET_LATEST_FIRMWARE "$model" "$csc" || true)"
            echo "${kind}_latest=${latest}" >> "$GITHUB_OUTPUT"
            if [ -z "$latest" ]; then
              echo "::warning::Latest firmware lookup failed for $model/$csc; a restored cache will be used if available."
            fi
          }

          write_firmware_version source "$SOURCE_FIRMWARE"
          write_firmware_version target "$TARGET_FIRMWARE"

      - name: Check restored source firmware cache
        id: source-firmware-cache-check
        env:
          FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.source_dir }}
          EXPECTED_FIRMWARE: ${{ steps.firmware-refs.outputs.source_latest }}
        run: |
          marker="out/odin/$FIRMWARE_DIR/.downloaded"
          if [[ -s "$marker" ]]; then
            cached_firmware="$(cat "$marker")"
            if [[ -z "$EXPECTED_FIRMWARE" || "$cached_firmware" == "$EXPECTED_FIRMWARE" ]]; then
              echo "usable=true" >> "$GITHUB_OUTPUT"
              echo "Using cached source firmware $cached_firmware"
              exit 0
            fi
            echo "Cached source firmware $cached_firmware is stale; expected $EXPECTED_FIRMWARE"
          fi
          echo "usable=false" >> "$GITHUB_OUTPUT"

      - name: Check restored target firmware cache
        id: target-firmware-cache-check
        env:
          FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.target_dir }}
          EXPECTED_FIRMWARE: ${{ steps.firmware-refs.outputs.target_latest }}
        run: |
          marker="out/odin/$FIRMWARE_DIR/.downloaded"
          if [[ -s "$marker" ]]; then
            cached_firmware="$(cat "$marker")"
            if [[ -z "$EXPECTED_FIRMWARE" || "$cached_firmware" == "$EXPECTED_FIRMWARE" ]]; then
              echo "usable=true" >> "$GITHUB_OUTPUT"
              echo "Using cached target firmware $cached_firmware"
              exit 0
            fi
            echo "Cached target firmware $cached_firmware is stale; expected $EXPECTED_FIRMWARE"
          fi
          echo "usable=false" >> "$GITHUB_OUTPUT"

      - name: Discard stale firmware caches
        if: steps.source-firmware-cache-check.outputs.usable != 'true' || steps.target-firmware-cache-check.outputs.usable != 'true'
        env:
          SOURCE_FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.source_dir }}
          SOURCE_CACHE_USABLE: ${{ steps.source-firmware-cache-check.outputs.usable }}
          TARGET_FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.target_dir }}
          TARGET_CACHE_USABLE: ${{ steps.target-firmware-cache-check.outputs.usable }}
        run: |
          if [[ "$SOURCE_CACHE_USABLE" != "true" ]]; then
            rm -rf "out/odin/$SOURCE_FIRMWARE_DIR"
          fi
          if [[ "$TARGET_CACHE_USABLE" != "true" ]]; then
            rm -rf "out/odin/$TARGET_FIRMWARE_DIR"
          fi

      - name: Download source firmware
        if: steps.source-firmware-cache-check.outputs.usable != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-target

      - name: Calculate source firmware cache key
        id: source-firmware-key
        if: steps.source-firmware-cache-check.outputs.usable != 'true'
        env:
          FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.source_dir }}
        run: |
          marker="out/odin/$FIRMWARE_DIR/.downloaded"
          if [[ ! -s "$marker" ]]; then
            echo "Downloaded source firmware marker is missing: $marker" >&2
            exit 1
          fi
          firmware="$(cat "$marker")"
          version_hash="$(printf '%s' "$firmware" | sha256sum | cut -c1-16)"
          echo "key=firmware-${RUNNER_OS}-source-${FIRMWARE_DIR}-${version_hash}" >> "$GITHUB_OUTPUT"

      - name: Save source firmware cache
        if: success() && steps.source-firmware-cache-check.outputs.usable != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: out/odin/${{ steps.firmware-paths.outputs.source_dir }}
          key: ${{ steps.source-firmware-key.outputs.key }}

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-target

      - name: Download target firmware
        if: steps.target-firmware-cache-check.outputs.usable != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-source

      - name: Calculate target firmware cache key
        id: target-firmware-key
        if: steps.target-firmware-cache-check.outputs.usable != 'true'
        env:
          FIRMWARE_DIR: ${{ steps.firmware-paths.outputs.target_dir }}
        run: |
          marker="out/odin/$FIRMWARE_DIR/.downloaded"
          if [[ ! -s "$marker" ]]; then
            echo "Downloaded target firmware marker is missing: $marker" >&2
            exit 1
          fi
          firmware="$(cat "$marker")"
          version_hash="$(printf '%s' "$firmware" | sha256sum | cut -c1-16)"
          echo "key=firmware-${RUNNER_OS}-target-${FIRMWARE_DIR}-${version_hash}" >> "$GITHUB_OUTPUT"

      - name: Save target firmware cache
        if: success() && steps.target-firmware-cache-check.outputs.usable != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: out/odin/${{ steps.firmware-paths.outputs.target_dir }}
          key: ${{ steps.target-firmware-key.outputs.key }}

      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-source

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              ./scripts/make_rom.sh
          else
              ./scripts/make_rom.sh --no-rom-zip
          fi

      - name: Upload installable ROM ZIP
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/a52sxq-mintos-adapted')
        uses: actions/upload-artifact@v4
        with:
          name: MintOS-a52sxq-${{ github.run_number }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 14
